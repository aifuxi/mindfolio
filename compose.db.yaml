services:
  postgres:
    image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    environment:
      POSTGRES_USER: mindfolio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?需要数据库密码}
      POSTGRES_DB: mindfolio_dev
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindfolio -d mindfolio_dev"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  postgres_data:
