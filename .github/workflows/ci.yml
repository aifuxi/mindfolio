name: 工程检查

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.6.14
          install: false
      - run: mise install --locked rust node pnpm
      - run: mise run ci
      - uses: docker/setup-buildx-action@v4
      - run: mise run image:build
      - run: mise run image:verify

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.6.14
          install: false
      - run: mise install --locked rust node pnpm
      - uses: docker/setup-buildx-action@v4
      - run: mise run image:build
      - run: mise run image:verify
      - run: mise run image:publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
