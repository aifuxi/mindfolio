[tools]
rust = { version = "1.97.1", profile = "minimal", components = ["rustfmt", "clippy"] }
node = "24.21.0"
pnpm = "12.3.4"
restic = "0.19.1"

[tasks.setup]
description = "安装锁定依赖"
run = ["mise install --locked rust node pnpm restic", "bash scripts/verify-toolchain.sh", "pnpm install --frozen-lockfile", "cargo fetch --locked"]

[tasks."dev:api"]
depends = ["db:start"]
run = "bash scripts/db.sh dev-api"

[tasks."dev:admin"]
depends = ["setup"]
run = "pnpm --filter @mindfolio/admin dev"

[tasks.dev]
description = "启动本地 API 和管理端"
depends = ["dev:api", "dev:admin"]

[tasks.fmt]
description = "修复 Rust 与前端格式"
depends = ["setup"]
run = ["cargo fmt --all", "pnpm exec prettier --write apps/admin scripts/*.mjs packages/api-contract/package.json package.json pnpm-workspace.yaml eslint.config.js"]

[tasks."fmt:check"]
depends = ["setup"]
run = ["cargo fmt --all -- --check", "pnpm exec prettier --check apps/admin scripts/*.mjs packages/api-contract/package.json package.json pnpm-workspace.yaml eslint.config.js"]

[tasks.lint]
depends = ["setup"]
run = ["cargo clippy --workspace --all-targets --locked -- -D warnings", "pnpm exec eslint apps/admin/src apps/admin/e2e apps/admin/vite.config.ts apps/admin/playwright.config.ts eslint.config.js scripts/*.mjs --max-warnings 0"]

[tasks."contract:generate"]
description = "从 Rust DTO 生成 OpenAPI 与 TypeScript 类型"
depends = ["setup"]
run = "node scripts/contract.mjs generate"

[tasks."contract:check"]
description = "只读检查 OpenAPI 与 TypeScript 类型产物"
depends = ["setup"]
run = "node scripts/contract.mjs check"

[tasks.typecheck]
depends = ["contract:check"]
run = "pnpm --filter @mindfolio/admin exec vue-tsc --noEmit -p tsconfig.app.json"

[tasks.check]
description = "执行格式、lint 与类型检查"
depends = ["fmt:check", "lint", "typecheck"]

[tasks.test]
depends = ["db:start"]
run = ["bash scripts/db.sh test", "node --test scripts/backup.test.mjs", "pnpm --filter @mindfolio/admin test", "pnpm --filter @mindfolio/admin exec playwright install --with-deps chromium", "pnpm --filter @mindfolio/admin test:browser"]

[tasks."backup:init"]
description = "初始化独立的加密备份仓库"
run = "node scripts/backup.mjs init"

[tasks."backup:run"]
description = "创建并读回校验数据库恢复点"
run = "node scripts/backup.mjs run"

[tasks."backup:state"]
description = "保存 Portainer 与 Caddy 入口状态"
run = "node scripts/backup.mjs state"

[tasks."backup:age"]
description = "检查服务器外数据库恢复点年龄并记录异常"
run = "node scripts/backup.mjs age"

[tasks."backup:prune"]
description = "按快照时间清理旧恢复点"
run = "node scripts/backup.mjs prune"

[tasks."backup:list"]
description = "列举服务器外有效恢复点"
run = "node scripts/backup.mjs list"

[tasks."backup:verify"]
description = "读回并校验指定恢复点；通过参数传入完整快照 ID"
run = "node scripts/backup.mjs verify"

[tasks."db:start"]
description = "启动本地 PostgreSQL"
depends = ["setup"]
run = "bash scripts/db.sh start"

[tasks."db:stop"]
description = "停止本地 PostgreSQL 并保留数据卷"
run = "bash scripts/db.sh stop"

[tasks."db:status"]
description = "查询本地 PostgreSQL 状态"
run = "bash scripts/db.sh status"

[tasks."db:migrate"]
description = "迁移开发数据库"
depends = ["db:start"]
run = "bash scripts/db.sh migrate"

[tasks."admin:init"]
description = "交互式初始化唯一管理者；需先设置 ADMIN_USERNAME"
depends = ["db:start"]
run = "bash scripts/db.sh admin-init"

[tasks."admin:reset"]
description = "交互式重置管理者密码并撤销全部会话"
depends = ["db:start"]
run = "bash scripts/db.sh admin-reset"

[tasks."db:prepare:test"]
description = "准备隔离的测试数据库"
depends = ["db:start"]
run = "bash scripts/db.sh prepare-test"

[tasks."db:verify:empty"]
description = "验证空库和重复迁移"
depends = ["db:start"]
run = "bash scripts/db.sh verify-empty"

[tasks.build]
depends = ["contract:check"]
run = ["cargo build --workspace --locked", "pnpm --filter @mindfolio/admin build"]

[tasks."build:release"]
description = "使用锁定依赖构建生产产物"
depends = ["setup"]
run = ["cargo build --release --locked --bin mindfolio-api --bin migrate --bin admin", "pnpm --filter @mindfolio/admin build"]

[tasks."image:build"]
description = "构建 Linux x64 API、管理端与 AliDNS 入口镜像"
run = "bash scripts/images.sh build"

[tasks."image:verify"]
description = "验证生产镜像、AliDNS 模块、健康检查与管理端代理"
run = "bash scripts/images.sh verify"

[tasks."image:publish"]
description = "仅在受控流水线发布 GHCR 镜像"
run = "bash scripts/images.sh publish"

[tasks."deploy:check"]
description = "检查服务器部署 Compose 配置"
run = "bash scripts/deploy.sh check"

[tasks."deploy:verify"]
description = "在隔离容器中验证三个服务网络边界和入口路由"
run = "bash scripts/deployment-verify.sh"

[tasks."deploy:network:create"]
run = "bash scripts/deploy.sh network:create"

[tasks."deploy:edge:config:sync"]
run = "bash scripts/deploy.sh edge:config:sync"

[tasks."deploy:portainer:up"]
run = "bash scripts/deploy.sh portainer:up"

[tasks."deploy:db:up"]
run = "bash scripts/deploy.sh db:up"

[tasks."deploy:migrate"]
run = "bash scripts/deploy.sh migrate"

[tasks."deploy:admin:init"]
run = "bash scripts/deploy.sh admin:init"

[tasks."deploy:admin:reset"]
run = "bash scripts/deploy.sh admin:reset"

[tasks."deploy:app:up"]
run = "bash scripts/deploy.sh app:up"

[tasks."deploy:edge:up"]
run = "bash scripts/deploy.sh edge:up"

[tasks."deploy:edge:reload"]
run = "bash scripts/deploy.sh edge:reload"

[tasks."deploy:status"]
run = "bash scripts/deploy.sh status"

[tasks.ci]
description = "执行全部质量检查、测试和构建"
depends = ["check", "test", "build", "db:verify:empty", "contract:check"]
