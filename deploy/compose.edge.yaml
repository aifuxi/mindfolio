name: mindfolio-edge

services:
  edge:
    image: ${EDGE_IMAGE:?缺少入口镜像 digest}
    restart: unless-stopped
    ports:
      - ${EDGE_HTTP_PORT:-80}:80
      - ${EDGE_HTTPS_PORT:-443}:443
      - ${EDGE_HTTPS_UDP_PORT:-443}:443/udp
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?缺少管理域名}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:?缺少阿里云 AccessKey ID}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:?缺少阿里云 AccessKey Secret}
    volumes:
      - ${EDGE_CADDY_DIR:-/srv/mindfolio/edge/caddy}:/etc/caddy:ro
      - edge_data:/data
      - edge_config:/config
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 30s

volumes:
  edge_data:
    name: ${EDGE_DATA_VOLUME:-mindfolio_edge_data}
  edge_config:
    name: ${EDGE_CONFIG_VOLUME:-mindfolio_edge_config}

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-mindfolio_edge}
